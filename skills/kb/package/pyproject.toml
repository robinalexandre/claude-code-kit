[project]
name = "kb"
version = "0.1.0"
description = "Personal knowledge base: Markdown notes with links, indexed in SQLite for text, semantic and graph search."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
embed = ["fastembed>=0.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
kb = "kb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S310", "S603", "S607"]
