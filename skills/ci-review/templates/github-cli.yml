# .github/workflows/ai-review.yml
# Review with a proof check, through the CLI in headless mode and review-prompt.md.
# Secret: ANTHROPIC_API_KEY. The job's own GITHUB_TOKEN reads the PR and posts the comment.
# Another agent CLI works the same way: replace the "Review" command, keep the prompt file.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install the CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --json title,body,comments > pr.json
          gh pr diff "$PR" > pr.diff
          claude -p --bare --permission-mode dontAsk --max-turns 20 --allowedTools "Read" "Grep" "Glob" \
            "Pull request: read pr.json (title, description with the proof links, comments) and pr.diff. Reply with the comment text only. $(cat .github/ai-review/review-prompt.md)" \
            > review.md
          gh pr comment "$PR" --body-file review.md
