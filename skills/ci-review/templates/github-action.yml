# .github/workflows/ai-review.yml
# Code review by the official action and plugin, on every PR push.
# Secret: ANTHROPIC_API_KEY, or CLAUDE_CODE_OAUTH_TOKEN for a Claude Pro, Max, Team or Enterprise seat
# (`claude setup-token`; swap the input below for `claude_code_oauth_token`), or use_bedrock / use_vertex.
# Actions are pinned to a commit (a tag can be moved); let Dependabot or Renovate bump them.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# The id-token permission lets the action trade it for its GitHub App token, and Bedrock or Vertex sign in with it.
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
