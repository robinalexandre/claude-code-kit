# Add to .gitlab-ci.yml. One review pass on every merge request pipeline, with the repo's REVIEW.md.
# Masked CI/CD variables: ANTHROPIC_API_KEY (Console billing) or CLAUDE_CODE_OAUTH_TOKEN (a Claude seat:
# `claude setup-token`), and GITLAB_REVIEW_TOKEN (project access token, api scope) so the review can post its note.
# See code.claude.com/docs/en/gitlab-ci-cd (beta).
# The MR's text and diff can carry instructions aimed at the agent, so the agent runs with no CI token in its
# environment, reads only the workspace, and its reply is checked for the secrets before it is posted. --bare
# skips the branch's own hooks and MCP servers but reads only ANTHROPIC_API_KEY: with a seat token, the job
# deletes them instead.
ai-review:
  stage: test
  image: node:24-bookworm-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git jq > /dev/null
    - curl -fsSL https://claude.ai/install.sh | bash
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - |
      API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID"
      curl -fsS -H "PRIVATE-TOKEN: $GITLAB_REVIEW_TOKEN" "$API" | jq '{title, description}' > mr.json
      git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      git diff "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD" > mr.diff
      # The rules come from the target branch: the MR could rewrite its own.
      git show "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:ci/ai-review/review-prompt.md" > /tmp/review-prompt.md
      git show "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:REVIEW.md" > /tmp/REVIEW.md 2>/dev/null || : > /tmp/REVIEW.md
      if [ -n "$ANTHROPIC_API_KEY" ]; then
        auth="ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"; bare=--bare
      else
        auth="CLAUDE_CODE_OAUTH_TOKEN=$CLAUDE_CODE_OAUTH_TOKEN"; bare=
        rm -rf .claude .mcp.json
      fi
      env -i HOME="$HOME" PATH="$PATH" "$auth" \
        claude -p "Merge request: read mr.json (title, description with the proof links) and mr.diff. Reply with the comment text only. $(cat /tmp/review-prompt.md)

      The repository's REVIEW.md:
      $(cat /tmp/REVIEW.md)" \
        $bare --permission-mode dontAsk --max-turns 30 \
        --allowedTools "Read(./**)" "Grep" "Glob" --disallowedTools "Read(//proc/**)" "Read(~/**)" "Read(//tmp/**)" \
        > review.md
      for secret in "$ANTHROPIC_API_KEY" "$CLAUDE_CODE_OAUTH_TOKEN" "$GITLAB_REVIEW_TOKEN" "$CI_JOB_TOKEN"; do
        if [ -n "$secret" ] && grep -qF -- "$secret" review.md; then
          echo "The review quotes a secret; not posted." >&2
          exit 1
        fi
      done
      jq -n --rawfile body review.md '{body: $body}' |
        curl -fsS -H "PRIVATE-TOKEN: $GITLAB_REVIEW_TOKEN" -H "Content-Type: application/json" --data @- "$API/notes" > /dev/null
