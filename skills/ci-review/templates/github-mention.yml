# .github/workflows/claude.yml
# Answers "@claude" in PR comments, reviews and issues: explains, reviews or pushes a fix to the PR branch.
# Auth, one secret: CLAUDE_CODE_OAUTH_TOKEN (a Claude seat, `claude setup-token`) or ANTHROPIC_API_KEY; keep the
# matching input below. The Claude GitHub App (https://github.com/apps/claude) must be installed on the repo:
# the action trades the id-token for its token, so its commits trigger CI and are signed by the app.
# Only people with write access to the repo can trigger it (the action checks the commenter).
# Claude gets no shell commands beyond the action's defaults: add test or build commands to claude_args only when
# they cannot reach production.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read the CI results of the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # The action pushes with its own app token: the job's token stays out of .git/config, where Claude could read it.
          persist-credentials: false
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
