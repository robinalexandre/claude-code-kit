name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: |
          command -v jq || { [ "$RUNNER_OS" = Windows ] && choco install -y jq; } || sudo apt-get install -y jq
          npm install -g @anthropic-ai/claude-code
          claude --version
      - name: Marketplace
        run: claude plugin validate .
      - name: Email guard
        run: bash tests/git-identity-guard.sh
      - name: Install in a sandbox
        run: bash tests/install-sandbox.sh --auto
      - name: Mods
        working-directory: mods
        run: for m in */; do claude plugin test "${m%/}" || exit 1; done
