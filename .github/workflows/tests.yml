name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          command -v jq || { [ "$RUNNER_OS" = Windows ] && choco install -y jq; } || sudo apt-get install -y jq
          case "$RUNNER_OS" in Linux) sudo apt-get install -y git-crypt ;; macOS) brew install git-crypt ;; esac
          npm install -g @anthropic-ai/claude-code
          claude --version
      - name: Marketplace
        run: claude plugin validate .
      - name: Plugin versions bumped
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: bash tests/plugin-versions.sh "${BASE:-origin/main}"
      - name: Every plugin installed and run
        run: bash tests/plugins.sh
      - name: Reminders, handoffs, inventory and the sync's install
        run: |
          bash tests/reminders.sh
          bash tests/handoff.sh
          bash tests/inventory.sh
          bash tests/sync-install.sh
          bash tests/kit-answers.sh
      - name: Email guard
        run: bash tests/git-identity-guard.sh
      - name: Reply marker check
        run: bash tests/drift-check.sh
      - name: Install in a sandbox
        run: |
          bash tests/install-sandbox.sh --auto
          bash tests/install-sandbox.sh --auto tests/answers-skip-a-group.txt
      - name: Updates of an install.sh install
        run: bash tests/kit-update-check.sh
      - name: pr-watch's shared snapshot and followed issues
        run: |
          py=$(command -v python3 || command -v python)
          "$py" -I tests/pr-watch-shared.py
          "$py" -I tests/pr-watch-issues.py
      - name: Knowledge base
        run: bash tests/kb.sh
      - name: The sync's minute poll
        run: bash tests/sync-poll.sh
      - name: The sync's encrypted folders
        run: bash tests/sync-crypt.sh
      - name: Mods
        working-directory: mods
        run: for m in */; do claude plugin test "${m%/}" || exit 1; done

  # Every mod also runs on the oldest Claude Code the kit supports: a mod using something newer keeps
  # a fallback (CONTRIBUTING.md, Rules for mods). Raise this only on purpose.
  mods-oldest:
    runs-on: ubuntu-latest
    env:
      OLDEST_CLAUDE: 2.1.300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Claude Code ${{ env.OLDEST_CLAUDE }}
        run: |
          npm install -g "@anthropic-ai/claude-code@$OLDEST_CLAUDE"
          claude --version
      - name: Mods
        working-directory: mods
        run: for m in */; do claude plugin test "${m%/}" || exit 1; done
